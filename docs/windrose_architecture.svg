<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Windrose architecture</title>
<desc>Open-Meteo and OpenAQ APIs feed into a Transformer, which loads into PostgreSQL. On failure, an agent classifies and acts, logging decisions back to Postgres. A Streamlit dashboard reads from Postgres.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="30" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Open-Meteo API</text>
<text x="130" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">weather data</text>

<rect x="40" y="120" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">OpenAQ API</text>
<text x="130" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">AQI readings</text>

<path d="M220 58 L260 58 L260 103 L300 103" fill="none" stroke="#444441" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M220 148 L260 148 L260 103" fill="none" stroke="#444441" stroke-width="0.5"/>

<rect x="300" y="75" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="380" y="95" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Transformer</text>
<text x="380" y="113" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">merges, fills gaps</text>

<line x1="460" y1="103" x2="500" y2="103" stroke="#444441" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="500" y="75" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="570" y="95" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">PostgreSQL</text>
<text x="570" y="113" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">weather_aqi</text>

<line x1="380" y1="131" x2="380" y2="180" stroke="#444441" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="392" y="158" font-family="sans-serif" font-size="12" fill="#5F5E5A">on failure</text>

<rect x="300" y="180" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="380" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Agent</text>
<text x="380" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">classify, retry/skip/alert</text>

<path d="M460 208 L570 208 L570 131" fill="none" stroke="#444441" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="465" y="222" font-family="sans-serif" font-size="12" fill="#5F5E5A">agent_decisions</text>

<line x1="570" y1="131" x2="570" y2="300" stroke="#444441" stroke-width="0.5"/>
<line x1="570" y1="300" x2="460" y2="300" stroke="#444441" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="300" y="272" width="160" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="380" y="292" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Streamlit</text>
<text x="380" y="310" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">dashboard</text>
</svg>
